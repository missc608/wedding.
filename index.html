<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政儒 & 怡靜 婚禮邀請函 | Our Wedding Invitation</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-warm: #d4a373;
            --secondary-sage: #8da399;
            --bg-light: #fbf9f6;
            --text-dark: #333333;
            --text-muted: #777777;
            --white-glow: rgba(255, 255, 255, 0.85);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 4px 20px rgba(212, 163, 115, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.8;
            overflow-x: hidden;
        }

        .en-font {
            font-family: 'Cormorant Garamond', serif;
        }

        .no-wrap {
            white-space: nowrap;
        }

        /* 1. 導覽列 (毛玻璃) */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(251, 249, 246, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(212, 163, 115, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-warm);
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-warm);
        }

        /* 3. 質感配置 - 全螢幕首頁 */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)), 
                        url('https://i.postimg.cc/tgMnz6H1/0J7A8207.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 0 1rem;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        /* 2. 計時器視覺 (獨立白色微光卡片) */
        .countdown-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .time-card {
            background: var(--white-glow);
            padding: 1rem 1.2rem;
            border-radius: 12px;
            box-shadow: var(--shadow-soft);
            min-width: 75px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .time-card .number {
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary-warm);
            line-height: 1;
        }

        .time-card .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
        }

        .divider {
            width: 1px;
            height: 35px;
            background-color: rgba(255, 255, 255, 0.5);
            margin: 0 4px;
        }

        /* 容器通用 */
        .section-padding {
            padding: 5rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title h2 {
            font-size: 2rem;
            color: var(--primary-warm);
            letter-spacing: 2px;
            font-weight: 400;
        }

        .section-title span {
            display: block;
            font-size: 0.9rem;
            color: var(--secondary-sage);
            letter-spacing: 3px;
        }

        /* 3. V-Card 垂直卡片設計 */
        .v-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--shadow-card);
            margin-bottom: 2rem;
            border: 1px solid rgba(212, 163, 115, 0.1);
        }

        .v-card-item {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            text-align: center;
        }

        .info-group h3 {
            color: var(--secondary-sage);
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 2rem 0;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
        }

        /* 7. 摺疊式面板 (Accordion) */
        .accordion {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(141, 163, 153, 0.3);
            margin-top: 1rem;
        }

        .accordion-header {
            background-color: #fff;
            padding: 1.2rem 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--text-dark);
            transition: background 0.3s;
        }

        .accordion-header:hover {
            background-color: #f4efe9;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background-color: #faf8f5;
            padding: 0 1.5rem;
        }

        .accordion-content p {
            padding: 1.2rem 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            border-top: 1px dashed rgba(0,0,0,0.05);
        }

        /* 4. & 8. 表單樣式與動態邏輯 */
        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* 4. 中英雙語標籤 */
        label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label .en-label {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.85rem;
            color: var(--secondary-sage);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input[type="text"], input[type="email"], input[type="number"], select, textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            background-color: #fcfbf9;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-warm);
        }

        /* 8. 條件隱藏區塊 */
        .conditional-field {
            display: none;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary-warm);
            color: white;
            padding: 1rem
